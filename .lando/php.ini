; Local overrides on top of Lando's own php.ini (xxx-lando-default.ini), which
; already sets memory_limit (via PHP_MEMORY_LIMIT, default 1G), 100M upload
; limits, UTC timezone, error logging and xdebug.start_with_request=trigger.

; Pick up file edits immediately instead of every 2s.
opcache.revalidate_freq = 0

; Xdebug's default log level (7) floods /tmp/xdebug.log with "could not
; connect" noise whenever no IDE is listening.
xdebug.log_level = 0

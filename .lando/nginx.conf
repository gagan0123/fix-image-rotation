# WordPress single-site vhost for Lando.
#
# Based on the Lando wordpress recipe's default.conf.tpl. Local changes are
# marked "rtCamp:". The file is rendered through Lando's template step, so
# {{LANDO_WEBROOT}} is substituted at container start.

# Upstream to abstract backend connection(s) for php
upstream php {
  server fpm:9000;
}

server {

  listen 80 default_server;
  listen 443 ssl;

  server_name localhost;

  ssl_certificate           /certs/cert.crt;
  ssl_certificate_key       /certs/cert.key;
  ssl_verify_client         off;

  ssl_session_cache    shared:SSL:1m;
  ssl_session_timeout  5m;

  port_in_redirect off;
  client_max_body_size 100M;

  root "{{LANDO_WEBROOT}}";

  index index.php;

  # rtCamp: uploads that are missing locally.
  # By default a missing upload is a plain 404. To serve them from production
  # instead, replace the `return 404;` in @prod_uploads with a redirect, e.g.
  #   return 302 https://example.com$request_uri;
  # A redirect is preferred over proxy_pass: it needs no SNI/TLS tuning and a
  # wrong hostname fails fast instead of stalling every request for 60s.
  location ^~ /wp-content/uploads/ {
    access_log off;
    location ~ \.php$ {
      # Prevent direct execution of PHP files placed in uploads.
      deny all;
    }
    try_files $uri @prod_uploads;
  }

  location @prod_uploads {
    return 404;
  }

  location = /favicon.ico {
    log_not_found off;
    access_log off;
  }

  location = /robots.txt {
    allow all;
    log_not_found off;
    access_log off;
  }

  location / {
    # include the "?$args" part so non-default permalinks don't break when using query string
    try_files $uri $uri/ /index.php?$args;
  }

  location ~ \.php$ {
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
    include fastcgi_params;
    fastcgi_pass php;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
  }

  # rtCamp: static assets. This is a development environment, so never let the
  # browser cache aggressively; `no-cache` still allows conditional requests.
  location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot|mp4|webm)$ {
    add_header Cache-Control "no-cache";
    log_not_found off;
    access_log off;
    try_files $uri /index.php?$args;
  }

}

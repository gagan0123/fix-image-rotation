WP6.2:PHP7.4:
    stage: test
    image: gagan0123/php:7.4
    services:
        - mysql:8.0
    script:
        - bash bin/install-wp-tests.sh wordpress_tests root mysql mysql 6.2.6 true
        - phpunit --configuration phpunit.xml.dist

Deploy:
    stage: deploy
    environment:
        name: deployment
    image: gagan0123/svn:latest
    when: manual
    script:
        - bash bin/release-plugin.sh

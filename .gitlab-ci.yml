variables:
    MYSQL_DATABASE: wordpress_tests
    MYSQL_ROOT_PASSWORD: mysql

stages:
    - verify
    - test
    - deploy

PHPCS:PHP8.2:
    stage: verify
    image: gagan0123/php:8.2
    script:
        - phpcs

WP-Latest:PHP7.4:
    stage: test
    image: gagan0123/php:7.4
    services:
        - mysql:8.0
    script:
        - bash bin/install-wp-tests.sh wordpress_tests root mysql mysql latest true
        - phpunit --configuration phpunit.xml.dist

WP-Latest:PHP8.0:
    stage: test
    image: gagan0123/php:8.0
    services:
        - mysql:8.0
    script:
        - bash bin/install-wp-tests.sh wordpress_tests root mysql mysql latest true
        - phpunit --configuration phpunit.xml.dist

WP-Latest:PHP8.1:
    stage: test
    image: gagan0123/php:8.1
    services:
        - mysql:8.0
    script:
        - bash bin/install-wp-tests.sh wordpress_tests root mysql mysql latest true
        - phpunit --configuration phpunit.xml.dist

WP-Latest:PHP8.2:
    stage: test
    image: gagan0123/php:8.2
    services:
        - mysql:8.0
    script:
        - bash bin/install-wp-tests.sh wordpress_tests root mysql mysql latest true
        - phpunit --configuration phpunit.xml.dist

WP-Latest:PHP8.3:

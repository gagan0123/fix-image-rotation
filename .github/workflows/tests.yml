name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
        wp: ['latest']
        include:
          - php: '8.2'
            wp: '6.2'
          - php: '8.2'
            wp: 'nightly'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: exif, gd, imagick, mysqli
          coverage: none

      - name: Install PHPUnit and Polyfills
        run: |
          composer global require phpunit/phpunit:"^9" yoast/phpunit-polyfills:"^2.0"
          echo "WP_TESTS_PHPUNIT_POLYFILLS_PATH=$(composer global config home)/vendor/yoast/phpunit-polyfills" >> $GITHUB_ENV

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 ${{ matrix.wp }} true

      - name: Run PHPUnit
        run: phpunit --configuration phpunit.xml.dist
